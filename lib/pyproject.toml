[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-misp-connector"
version = "1.0.0"
description = "Conector Ruvic de intercambio de indicadores de amenaza (threat intel) para MISP"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_misp_connector*"]
